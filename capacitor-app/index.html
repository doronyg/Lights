<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MyLightsController - Home Assistant Device Control">
  <meta name="theme-color" content="#6200ea">
  <meta http-equiv="Content-Security-Policy" content="default-src https: http: 'self' 'unsafe-inline' 'unsafe-eval' data:;">

  <title>MyLightsController</title>

  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <!-- Onboarding Screen -->
  <div id="app-container"></div>

  <!-- Main App -->
  <div id="main-app">
    <!-- Header -->
    <header id="main-app-header">
      <h1>🏠 MyLightsController</h1>
      <div class="header-buttons">
        <button class="icon-btn" id="refreshBtn" title="Refresh">🔄</button>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- Device Grid -->
    <div id="device-grid"></div>
  </div>

  <!-- Settings Panel -->
  <div id="settings-container"></div>

  <!-- App Scripts -->
  <script type="module" src="./src/app.js"></script>

  <!-- Setup header button listeners -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const refreshBtn = document.getElementById('refreshBtn');
      const settingsBtn = document.getElementById('settingsBtn');

      if (refreshBtn) {
        refreshBtn.addEventListener('click', async () => {
          if (window.myLightsApp) {
            try {
              const appController = (await import('./src/services/appController.js')).default;
              refreshBtn.style.animation = 'spin 1s linear';
              await appController.loadDevices();
              setTimeout(() => {
                refreshBtn.style.animation = 'none';
              }, 1000);
            } catch (error) {
              console.error('Refresh error:', error);
            }
          }
        });
      }

      if (settingsBtn) {
        settingsBtn.addEventListener('click', () => {
          if (window.myLightsApp) {
            window.myLightsApp.toggleSettings();
          }
        });
      }
    });
  </script>
</body>
</html>
